name: Compilar AAB Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos del proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Motor Android (Flutter)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'

      - name: Instalar Flet Directamente
        run: pip install -r requirements.txt

      - name: Construir la App (AAB)
        run: flet build aab --org com.erwingim --project bitacorafinanciera

      - name: Entregar Archivo Final
        uses: actions/upload-artifact@v4
        with:
          name: Bitacora-AAB
          path: build/aab/**/*.aab
