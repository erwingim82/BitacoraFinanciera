name: Compilar APK y AAB Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos del proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Motor Android (Flutter y Licencias)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'

      - name: Aceptar licencias de Android automáticamente
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Configurar requerimientos móviles
        run: |
          echo "certifi" > requirements.txt

      - name: Instalar Flet Estable (0.25.2) y Certifi
        run: |
          pip install flet==0.25.2 certifi

      - name: Preparar y Parchar Plantilla Oficial para API 36
        run: |
          git clone --branch 0.25.2 https://github.com/flet-dev/flet-build-template.git custom_template
          find custom_template -name "build.gradle" -type f -exec sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' {} + || true
          find custom_template -name "build.gradle" -type f -exec sed -i 's/targetSdkVersion 34/targetSdkVersion 36/g' {} + || true
          find custom_template -name "build.gradle" -type f -exec sed -i 's/compileSdk = 34/compileSdk = 36/g' {} + || true
          find custom_template -name "build.gradle" -type f -exec sed -i 's/targetSdk = 34/targetSdk = 36/g' {} + || true
          find custom_template -name "build.gradle" -type f -exec sed -i 's/compileSdkVersion 35/compileSdkVersion 36/g' {} + || true
          find custom_template -name "build.gradle" -type f -exec sed -i 's/compileSdk = 35/compileSdk = 36/g' {} + || true

      - name: Construir APK Estable
        run: |
          yes | flet build apk --template-dir "$PWD/custom_template" --build-version "1.0.38" --build-number 38 --org com.erwingim --project bitacorafinanciera

      - name: Construir y Firmar AAB Oficial para Google Play Console con API 36
        run: |
          yes | flet build aab \
            --template-dir "$PWD/custom_template" \
            --build-version "1.0.38" \
            --build-number 38 \
            --org com.erwingim \
            --project bitacorafinanciera \
            --android-signing-key-store "$PWD/bitacora-key.keystore" \
            --android-signing-key-store-password "bitacora2026" \
            --android-signing-key-alias "bitacora" \
            --android-signing-key-password "bitacora2026"

      - name: Entregar Archivo AAB Oficial
        uses: actions/upload-artifact@v4
        with:
          name: Bitacora-AAB-Oficial
          path: build/aab/**/*.aab

      - name: Entregar Archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: Bitacora-APK
          path: build/apk/**/*.apk
