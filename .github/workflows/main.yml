name: Compilar APK y AAB Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos del proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Motor Android (Flutter y Licencias)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'

      - name: Instalar Flet y Dependencias
        run: |
          pip install flet==0.25.2 certifi

      - name: Configurar dependencias exactas para Android
        run: |
          echo "certifi" > requirements.txt

      - name: Construir la App y Forzar API 36
        run: |
          # 1. Ejecutamos un comando rápido de Flet para que descargue y genere la plantilla del proyecto en build/flutter
          flet build apk --build-version "1.0.11" --build-number 12 || true

          # 2. PARCHE CRÍTICO: Buscar y reemplazar cualquier rastro de la API 34 por la API 36 en todos los archivos gradle generados
          echo "Forzando API 36 en los archivos de Gradle generados..."
          find build/flutter -name "build.gradle" -type f -exec sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' {} +
          find build/flutter -name "build.gradle" -type f -exec sed -i 's/targetSdkVersion 34/targetSdkVersion 36/g' {} +
          find build/flutter -name "build.gradle" -type f -exec sed -i 's/compileSdk = 34/compileSdk = 36/g' {} +
          find build/flutter -name "build.gradle" -type f -exec sed -i 's/targetSdk = 34/targetSdk = 36/g' {} +
          find build/flutter -name "build.gradle" -type f -exec sed -i 's/compileSdk 34/compileSdk 36/g' {} +
          find build/flutter -name "build.gradle" -type f -exec sed -i 's/targetSdk 34/targetSdk 36/g' {} +

          # También revisamos si existe el archivo android/app/build.gradle directamente
          if [ -f "build/flutter/android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' build/flutter/android/app/build.gradle
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 36/g' build/flutter/android/app/build.gradle
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' build/flutter/android/app/build.gradle
            sed -i 's/targetSdk = [0-9]*/targetSdk = 36/g' build/flutter/android/app/build.gradle
          fi

          # 3. Compilar definitivamente los artefactos limpios ya modificados
          yes | flet build apk --build-version "1.0.11" --build-number 12
          yes | flet build aab --build-version "1.0.11" --build-number 12 --org com.erwingim --project bitacorafinanciera

      - name: Firmar el archivo AAB correctamente para Google Play
        run: |
          AAB_FILE=$(find build/aab -name "*.aab" | head -n 1)
          
          # Limpiar firmas genéricas previas
          zip -d "$AAB_FILE" META-INF/\* || true
          
          # Firmar usando jarsigner con los estándares de Google Play
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore bitacora-key.keystore \
            -storepass bitacora2026 \
            -keypass bitacora2026 \
            "$AAB_FILE" bitacora

      - name: Entregar Archivo AAB Oficial
        uses: actions/upload-artifact@v4
        with:
          name: Bitacora-AAB-Oficial
          path: build/aab/**/*.aab

      - name: Entregar Archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: Bitacora-APK
          path: build/apk/**/*.apk
