name: Generar Firma Digital

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generar Keystore
        run: |
          keytool -genkey -v -keystore bitacora-key.keystore -alias bitacora -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Erwin, OU=Desarrollo, O=Bitacora, L=Caracas, C=VE" -storepass "bitacora2026" -keypass "bitacora2026"
      - name: Entregar Keystore
        uses: actions/upload-artifact@v4
        with:
          name: MiFirmaDigital
          path: bitacora-key.keystore
