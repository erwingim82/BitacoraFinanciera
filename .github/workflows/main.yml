name: Compilar APK y AAB Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos del proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Motor Android (Flutter y Licencias)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - name: Instalar Flet en el Servidor
        run: |
          pip install --upgrade flet

      - name: Configurar dependencias exactas para Android
        run: |
          # Solo incluimos certifi (necesario para internet en Android) y evitamos librerías de PC
          echo "certifi" > requirements.txt

      - name: Construir la App (APK y AAB)
        run: |
          flet build apk --build-version "1.0.2" --build-number 3
          flet build aab --build-version "1.0.2" --build-number 3 --org com.erwingim --project bitacorafinanciera

      - name: Firmar el archivo AAB correctamente para Google Play
        run: |
          AAB_FILE=$(find build/aab -name "*.aab" | head -n 1)
          
          # Limpiar firmas genéricas previas
          zip -d "$AAB_FILE" META-INF/\* || true
          
          # Firmar usando jarsigner con los estándares de Google Play
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore bitacora-key.keystore \
            -storepass bitacora2026 \
            -keypass bitacora2026 \
            "$AAB_FILE" bitacora

      - name: Entregar Archivo AAB Oficial
        uses: actions/upload-artifact@v4
        with:
          name: Bitacora-AAB-Oficial
          path: build/aab/**/*.aab

      - name: Entregar Archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: Bitacora-APK
          path: build/apk/**/*.apk
