name: Compilar APK y AAB Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos del proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Motor Android (Flutter)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'

      - name: Instalar Flet Directamente
        run: pip install -r requirements.txt

      - name: Construir la App (APK y AAB)
        run: |
          flet build apk
          flet build aab --org com.erwingim --project bitacorafinanciera

      - name: Firmar el archivo AAB con apksigner (Modo Producción)
        run: |
          # Encontrar la ruta del build-tools de Android instalado en el servidor
          BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools -maxdepth 1 -mindepth 1 | sort | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          
          # Limpiar cualquier firma anterior por defecto
          AAB_FILE=$(find build/aab -name "*.aab" | head -n 1)
          zip -d "$AAB_FILE" META-INF/\* || true
          
          # Firmar correctamente con la herramienta oficial de Google
          $APKSIGNER sign --ks bitacora-key.keystore --ks-pass pass:bitacora2026 --key-pass pass:bitacora2026 "$AAB_FILE"
          
          # Verificar que la firma sea válida
          $APKSIGNER verify "$AAB_FILE"

      - name: Entregar Archivo AAB Firmado
        uses: actions/upload-artifact@v4
        with:
          name: Bitacora-AAB-Oficial
          path: build/aab/**/*.aab

      - name: Entregar Archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: Bitacora-APK
          path: build/apk/**/*.apk
