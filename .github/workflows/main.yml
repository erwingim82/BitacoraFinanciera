name: Compilar APK y AAB Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos del proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Motor Android (Flutter)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'

      - name: Instalar Flet Directamente
        run: pip install -r requirements.txt

      - name: Construir la App (APK y AAB)
        run: |
          flet build apk
          flet build aab --org com.erwingim --project bitacorafinanciera

      - name: Firmar el AAB con Bundletool (Oficial de Google)
        run: |
          # Descargar bundletool oficial
          curl -L -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          
          # Localizar el archivo AAB generado
          AAB_ORIGINAL=$(find build/aab -name "*.aab" | head -n 1)
          AAB_FIRMADO="build/aab/Bitacora-Oficial.aab"
          
          # Firmar correctamente con la herramienta de Google
          java -jar bundletool.jar sign \
            --bundle="$AAB_ORIGINAL" \
            --output="$AAB_FIRMADO" \
            --ks=bitacora-key.keystore \
            --ks-pass=pass:bitacora2026 \
            --ks-key-alias=bitacora \
            --key-pass=pass:bitacora2026

      - name: Entregar Archivo AAB Oficial
        uses: actions/upload-artifact@v4
        with:
          name: Bitacora-AAB-Oficial
          path: build/aab/Bitacora-Oficial.aab

      - name: Entregar Archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: Bitacora-APK
          path: build/apk/**/*.apk
