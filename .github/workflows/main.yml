name: Compilar APK y AAB Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos del proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Motor Android (Flutter y Licencias)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'

      - name: Aceptar licencias de Android automáticamente
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Instalar Flet Estable (0.25.2) y Certifi
        run: |
          pip install flet==0.25.2 certifi

      - name: Configurar dependencias móviles
        run: |
          echo "certifi" > requirements.txt

      - name: Generar estructura del proyecto con Flet (Paso 1)
        run: |
          # Esto descarga la plantilla base temporalmente sin compilar del todo el AAB final
          flet build apk --build-version "1.0.25" --build-number 25 --org com.erwingim --project bitacorafinanciera || true

      - name: Forzar API 36 Directamente en los Archivos de Gradle Generados (Paso 2)
        run: |
          echo "Buscando y actualizando SDKs a la API 36..."
          find build/flutter -name "build.gradle" -type f -exec sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' {} + || true
          find build/flutter -name "build.gradle" -type f -exec sed -i 's/targetSdkVersion 34/targetSdkVersion 36/g' {} + || true
          find build/flutter -name "build.gradle" -type f -exec sed -i 's/compileSdk = 34/compileSdk = 36/g' {} + || true
          find build/flutter -name "build.gradle" -type f -exec sed -i 's/targetSdk = 34/targetSdk = 36/g' {} + || true
          find build/flutter -name "build.gradle" -type f -exec sed -i 's/compileSdk 34/compileSdk 36/g' {} + || true
          find build/flutter -name "build.gradle" -type f -exec sed -i 's/targetSdk 34/targetSdk 36/g' {} + || true

      - name: Compilar Definitivamente el AAB (Paso 3)
        run: |
          yes | flet build aab --build-version "1.0.25" --build-number 25 --org com.erwingim --project bitacorafinanciera

      - name: Firmar el archivo AAB correctamente para Google Play
        run: |
          AAB_FILE=$(find build/aab -name "*.aab" | head -n 1)
          
          # Limpiar firmas genéricas previas
          zip -d "$AAB_FILE" META-INF/\* || true
          
          # Firmar usando jarsigner con los estándares de Google Play
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore bitacora-key.keystore \
            -storepass bitacora2026 \
            -keypass bitacora2026 \
            "$AAB_FILE" bitacora

      - name: Entregar Archivo AAB Oficial
        uses: actions/upload-artifact@v4
        with:
          name: Bitacora-AAB-Oficial
          path: build/aab/**/*.aab

      - name: Entregar Archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: Bitacora-APK
          path: build/apk/**/*.apk
